<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#00001A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
    <title>Honeysuckle Jump Studios</title>
</head>

<style>
    @import url("https://fonts.googleapis.com/css2?family=Aladin&display=swap");
</style>

<body>
    <!-- WebGPU/TSL Canvas-->
    <canvas id="canvas"></canvas>

    <!-- UI Layer -->
     <div id="ui-layer">
        <h1>Honeysuckle Jump Studios</h1>
        <p>Harbourer of Stories</p>
     </div>

    <!-- Menu Button -->
    <button class="ui-btn nav-toggle" aria-label="Open Menu">
        <span></span><span></span><span></span>
    </button>

    <!-- Menu Overlay -->
    <div id="menu-overlay">

        <!-- Main Menu -->
        <nav id="menu-main">
           <a class="menu-link" data-section="about">About</a>
           <a class="menu-link" data-section="portfolio">Portfolio</a>
           <a class="menu-link" data-section="contact">Contact</a>
        </nav>

        <!-- Content Menu -->
        <div id="menu-content">
            <button class="ui-btn back-btn">Back</button>
            <div class="content-body"></div>
        </div>
        
    </div>

    <script type = "module" src="./src/main.js"></script>

</body>
</html>
